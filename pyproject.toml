[project]
name = "siat"
version = "0.1.0"
description = "MCP-сервер над статистикой siat.stat.uz"
authors = [
    { name = "sharyarbek", email = "nerux2121@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
siat = "siat:main"
siat-crawl = "siat.crawl:main"
siat-load = "siat.load:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
